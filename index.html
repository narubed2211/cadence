<!DOCTYPE html>
<html lang="th" data-theme="marble">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ece9">
<meta name="description" content="Cadence — ติดตามกิจวัตรและบันทึกการออกกำลังกาย">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cadence</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  
/* =====================================================================
   Cadence — แอปติดตามกิจวัตรและออกกำลังกาย (PWA)
   ธีมทั้งหมดกำหนดด้วยตัวแปร CSS ด้านล่าง (เพิ่มธีมใหม่ = เพิ่มบล็อก [data-theme="..."])
   ===================================================================== */
:root{
  --font-ui:'Prompt','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-num:'Instrument Serif','Prompt',Georgia,serif;
  --r-xl:26px; --r-lg:18px; --r-md:12px; --r-sm:9px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* ---------- ธีม: Marble (สว่าง หินอ่อน+เขียวสน+ทองเหลือง) ---------- */
[data-theme="marble"]{
  color-scheme:light;
  --bg:#e9ece9; --glow:rgba(46,94,78,.13); --glow2:rgba(169,134,80,.10);
  --surface:#f6f7f4; --surface-2:#eceeea; --raise:#ffffff;
  --line:rgba(24,33,29,.11); --line-strong:rgba(24,33,29,.22);
  --text:#18211d; --dim:#5f6a64; --faint:#98a19b;
  --accent:#2e5e4e; --accent-ink:#ffffff; --accent-2:#a98650;
  --good:#2b7a57; --warn:#a96a12; --bad:#b03c2c;
  --chart-p:#2e5e4e; --chart-v:#5d8f9b; --chart-i:#a98650;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 18px 40px -22px rgba(24,33,29,.28);
  --grain:.05;
}
/* ---------- ธีม: Obsidian (มืด ถ่านอุ่น+แชมเปญ) ---------- */
[data-theme="obsidian"]{
  color-scheme:dark;
  --bg:#0d0f11; --glow:rgba(210,178,122,.10); --glow2:rgba(143,184,166,.07);
  --surface:#15181b; --surface-2:#1b1f23; --raise:#22272c;
  --line:rgba(236,232,223,.09); --line-strong:rgba(236,232,223,.2);
  --text:#ece8df; --dim:#8f958f; --faint:#5d625f;
  --accent:#d2b27a; --accent-ink:#1a1408; --accent-2:#8fb8a6;
  --good:#6fc29a; --warn:#e0a85a; --bad:#e67c6a;
  --chart-p:#d2b27a; --chart-v:#8fb8a6; --chart-i:#c98f73;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 44px -24px rgba(0,0,0,.8);
  --grain:.07;
}
/* ---------- ธีม: Sapphire (มืด น้ำเงินเข้ม) ---------- */
[data-theme="sapphire"]{
  color-scheme:dark;
  --bg:#0a101c; --glow:rgba(126,166,234,.13); --glow2:rgba(201,176,124,.06);
  --surface:#111a2b; --surface-2:#16223a; --raise:#1c2a48;
  --line:rgba(190,210,245,.1); --line-strong:rgba(190,210,245,.22);
  --text:#e6ecf7; --dim:#8b99b1; --faint:#56637c;
  --accent:#7ea6ea; --accent-ink:#07101f; --accent-2:#c9b07c;
  --good:#66c4a0; --warn:#e3b062; --bad:#ec7d73;
  --chart-p:#7ea6ea; --chart-v:#6fd0c8; --chart-i:#c9b07c;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 44px -24px rgba(0,0,0,.75);
  --grain:.06;
}
/* ---------- ธีม: Bordeaux (มืด ไวน์แดง+โรสคอปเปอร์) ---------- */
[data-theme="bordeaux"]{
  color-scheme:dark;
  --bg:#130c0f; --glow:rgba(217,154,141,.11); --glow2:rgba(200,172,120,.06);
  --surface:#1c1216; --surface-2:#24181d; --raise:#2c1e24;
  --line:rgba(245,225,225,.09); --line-strong:rgba(245,225,225,.2);
  --text:#f2e8e7; --dim:#a28f90; --faint:#6a5658;
  --accent:#d99a8d; --accent-ink:#1e0d0b; --accent-2:#c8ac78;
  --good:#7ec49a; --warn:#e1ab5c; --bad:#f0806f;
  --chart-p:#d99a8d; --chart-v:#c8ac78; --chart-i:#9fb7c9;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 22px 44px -24px rgba(0,0,0,.8);
  --grain:.07;
}
/* ---------- ธีม: Porcelain (สว่าง เทาน้ำเงินเย็น) ---------- */
[data-theme="porcelain"]{
  color-scheme:light;
  --bg:#e8ecf1; --glow:rgba(58,90,140,.13); --glow2:rgba(166,138,91,.08);
  --surface:#f6f8fb; --surface-2:#ebeff5; --raise:#ffffff;
  --line:rgba(26,40,66,.11); --line-strong:rgba(26,40,66,.22);
  --text:#17233a; --dim:#5d6c85; --faint:#97a3b6;
  --accent:#3a5a8c; --accent-ink:#ffffff; --accent-2:#a68a5b;
  --good:#2a7b66; --warn:#a8721a; --bad:#ad3c38;
  --chart-p:#3a5a8c; --chart-v:#3f8f86; --chart-i:#a68a5b;
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 18px 40px -22px rgba(23,35,58,.3);
  --grain:.05;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-ui);font-size:15px;line-height:1.55;font-weight:400;
  color:var(--text);background:var(--bg);min-height:100vh;
  background-image:
    radial-gradient(900px 520px at 12% -8%,var(--glow),transparent 65%),
    radial-gradient(760px 480px at 100% 4%,var(--glow2),transparent 60%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .5s var(--ease),color .3s;
}
/* เกรนบางๆ ให้พื้นผิวดูเป็นวัสดุ ไม่แบนเรียบ */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--font-num);font-weight:400;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.dim{color:var(--dim)}
[hidden]{display:none!important}


.icon-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--line);background:var(--surface);color:var(--text);transition:background .2s,transform .2s var(--ease);
}
.icon-btn:hover{background:var(--raise)} .icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}


/* ---------- ปุ่ม / ช่องกรอก ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 20px;border-radius:99px;font-size:14px;font-weight:500;white-space:nowrap;
  background:var(--accent);color:var(--accent-ink);border:1px solid transparent;
  transition:transform .2s var(--ease),filter .2s,opacity .2s;
}
.btn:hover:not(:disabled){filter:brightness(1.08)} .btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line-strong)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);filter:none}
.btn.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.danger:hover:not(:disabled){background:color-mix(in srgb,var(--bad) 10%,transparent);filter:none}
.btn.block{width:100%;padding:13px 20px;font-size:15px}
.btn.busy{position:relative;color:transparent}
.btn.busy::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;border:2px solid var(--accent-ink);border-right-color:transparent;animation:spin .7s linear infinite}
.btn.ghost.busy::after{border-color:var(--text);border-right-color:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--dim);margin-bottom:7px}
.field input[type=text],.field input[type=password],.field input[type=number]{
  width:100%;padding:12px 15px;border-radius:var(--r-md);border:1px solid var(--line-strong);
  background:var(--surface-2);outline:none;transition:border-color .2s,box-shadow .2s,background .2s;
}
.field input:focus{border-color:var(--accent);background:var(--raise);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:99px;background:var(--surface-2);overflow:hidden}
.stepper button{width:38px;height:40px;font-size:19px;color:var(--dim);transition:background .2s}
.stepper button:hover:not(:disabled){background:var(--raise);color:var(--text)}
.stepper button:disabled{opacity:.4;cursor:not-allowed}
.stepper input{width:68px;height:40px;border:0;background:transparent;text-align:center;font-weight:500;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input:disabled{opacity:.5}
.stepper.dirty{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--dim);transition:all .2s}
.chip:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
.chip:disabled{opacity:.4;cursor:not-allowed}

/* ---------- ลิ้นชักตั้งค่า / โมดอล / ทอสต์ ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;z-index:70;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line-strong);
  transform:translateX(104%);transition:transform .45s var(--ease);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);box-shadow:-30px 0 60px -30px rgba(0,0,0,.5);
}
.drawer.on{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;padding:20px 24px 14px}
.drawer .dh h2{font-size:17px;font-weight:500}
.drawer .db{padding:4px 24px 28px;overflow:auto;flex:1}
.drawer section{padding:18px 0;border-bottom:1px solid var(--line)}
.drawer section:last-child{border-bottom:0}
.drawer h3{font-size:14px;font-weight:500;margin-bottom:4px}
.drawer p.sub{font-size:12.5px;color:var(--dim);margin-bottom:12px}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.swatch{display:grid;gap:7px;justify-items:center;font-size:11.5px;color:var(--dim)}
.swatch .sw{width:100%;aspect-ratio:1;border-radius:14px;border:2px solid transparent;position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line-strong);transition:transform .2s var(--ease)}
.swatch .sw::after{content:"";position:absolute;right:-12%;bottom:-12%;width:58%;height:58%;border-radius:50%;background:var(--sa)}
.swatch[aria-pressed="true"] .sw{border-color:var(--text);transform:scale(1.04)}
.swatch[aria-pressed="true"]{color:var(--text)}
.switch-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;z-index:1}
.switch .tr{position:absolute;inset:0;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-strong);transition:background .3s}
.switch .tr::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:transform .3s var(--ease),background .3s}
.switch input:checked+.tr{background:var(--accent);border-color:transparent}
.switch input:checked+.tr::after{transform:translateX(18px);background:var(--accent-ink)}
.switch input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:22px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.modal .box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xl);padding:26px;box-shadow:var(--shadow)}
.modal h3{font-size:17px;font-weight:500;margin-bottom:8px}
.modal p{color:var(--dim);font-size:14px;margin-bottom:22px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end}
#toasts{position:fixed;z-index:90;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;gap:8px;justify-items:center;width:min(440px,calc(100% - 28px));pointer-events:none}
.toast{padding:11px 18px;border-radius:99px;font-size:14px;background:var(--text);color:var(--bg);box-shadow:0 14px 34px -12px rgba(0,0,0,.55);animation:toast-in .35s var(--ease);max-width:100%}
.toast.bad{background:var(--bad);color:#fff}.toast.ok{background:var(--good);color:#fff}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}}

html{overflow-x:clip} body{overflow-x:clip}
.drawer{visibility:hidden;box-shadow:none;transition:transform .45s var(--ease),visibility 0s .45s,box-shadow .3s}
.drawer.on{visibility:visible;box-shadow:-30px 0 60px -30px rgba(0,0,0,.5);transition:transform .45s var(--ease),visibility 0s,box-shadow .3s}
.seg{display:inline-flex;padding:3px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500;color:var(--dim);transition:all .25s var(--ease);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.16)}
.seg button:disabled{opacity:.45;cursor:not-allowed}

/* =====================================================================
   โครงหน้า / ส่วนหัว / แถบแท็บ
   ===================================================================== */
.app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 20px calc(120px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:40;margin:0 -20px;padding:calc(14px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:12px}
header.top::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--font-num);font-weight:400;font-size:30px;letter-spacing:-.01em;line-height:1}
.brand span{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1}
nav.tabs{
  position:fixed;z-index:50;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(440px,calc(100% - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:24px;
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid var(--line-strong);box-shadow:0 18px 40px -16px rgba(0,0,0,.45);
}
nav.tabs button{display:grid;justify-items:center;gap:3px;padding:8px 4px 7px;border-radius:18px;color:var(--dim);font-size:11.5px;font-weight:500;transition:all .3s var(--ease)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{background:var(--raise);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.18)}
@media (min-width:860px){
  nav.tabs{position:static;transform:none;margin:20px auto 0;width:max-content;display:flex;gap:4px;padding:5px}
  nav.tabs button{display:flex;align-items:center;gap:8px;padding:9px 18px;font-size:14px}
  .app{padding-bottom:60px}
}
.view{margin-top:22px;animation:view-in .5s var(--ease)}
@keyframes view-in{from{opacity:0;transform:translateY(10px)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow);min-width:0}
.panel>.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px 0}
.panel h2{font-size:15px;font-weight:500;letter-spacing:.01em}
.panel .sub{font-size:12.5px;color:var(--dim)}
.cols{display:grid;gap:18px}
@media (min-width:940px){.cols.two{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}.cols.even{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:18px;align-content:start}
.pad{padding:20px 24px 24px}
.dimtxt{color:var(--dim)} .tiny{font-size:12.5px}
.link{font-size:13px;color:var(--accent);text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.badge.ok{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent);border-color:color-mix(in srgb,var(--good) 28%,transparent)}
.badge.plus{color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 14%,transparent);border-color:color-mix(in srgb,var(--accent-2) 30%,transparent)}
.badge.pr{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}

/* =====================================================================
   วันนี้
   ===================================================================== */
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.greet h1{font-family:var(--font-num);font-weight:400;font-size:clamp(34px,6vw,50px);line-height:1;letter-spacing:-.01em}
.greet p{color:var(--dim);font-size:14px;margin-top:6px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 18px}
.dchip{display:grid;justify-items:center;gap:4px;padding:10px 0 9px;border-radius:var(--r-lg);border:1px solid transparent;color:var(--dim);transition:all .3s var(--ease);min-width:0}
.dchip small{font-size:11.5px}
.dchip .n{font-family:var(--font-num);font-size:24px;line-height:1;color:var(--text)}
.dchip .pbar{width:58%;height:3px;border-radius:3px;background:linear-gradient(to right,var(--accent) calc(var(--p,0)*100%),var(--line-strong) 0)}
.dchip:hover:not(:disabled){background:var(--surface)}
.dchip[aria-pressed="true"]{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow);color:var(--accent)}
.dchip.today small{color:var(--accent);font-weight:600}
.dchip:disabled{opacity:.4;cursor:default}
.summary{display:flex;align-items:center;gap:20px;padding:20px 24px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .t{stroke:var(--surface-2)} .ring .a{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s var(--ease)}
.ring .a.done{stroke:var(--good)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-num);font-weight:400;font-size:30px}
.summary h3{font-size:16px;font-weight:500}
.summary p{color:var(--dim);font-size:13.5px;margin-top:2px}
.summary .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.slot-h{display:flex;align-items:center;gap:8px;margin:20px 4px 10px;font-size:13px;color:var(--dim)}
.slot-h::after{content:"";flex:1;height:1px;background:var(--line)}
.habit{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 14px 14px 14px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px;transition:border-color .4s,background .4s}
.habit.ach{border-color:color-mix(in srgb,var(--accent) 38%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,var(--surface)),var(--surface))}
.habit .em{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:var(--surface-2);border:1px solid var(--line)}
.habit .main{min-width:0;text-align:left;cursor:pointer}
.habit .nm{font-weight:500;font-size:15.5px;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.habit .meta{font-size:12.5px;color:var(--dim);margin-top:1px}
.segp{display:flex;gap:4px;margin-top:9px;align-items:center}
.segp i{flex:1;max-width:44px;height:6px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);transition:background .4s var(--ease)}
.segp i.on{background:var(--accent);border-color:transparent} .segp i.x{background:var(--accent-2);border-color:transparent;max-width:20px}
.segp i.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.segp em{font-style:normal;font-size:12px;color:var(--dim);margin-left:6px;white-space:nowrap}
.check{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);color:transparent;background:var(--surface-2);transition:all .35s var(--ease);position:relative}
.check svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .4s var(--ease) .05s}
.check:hover:not(:disabled){border-color:var(--accent)}
.check:active:not(:disabled){transform:scale(.9)}
.check[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.check[aria-pressed="true"] svg{stroke-dashoffset:0}
.check:disabled{opacity:.35;cursor:not-allowed}
.addbtn{width:100%;padding:16px;border-radius:var(--r-xl);border:1.5px dashed var(--line-strong);color:var(--dim);font-size:14px;font-weight:500;transition:all .3s var(--ease);margin-top:6px}
.addbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.empty{text-align:center;padding:36px 22px 30px}
.empty .big{font-size:46px;margin-bottom:8px}
.empty h3{font-family:var(--font-num);font-weight:400;font-size:28px}
.empty p{color:var(--dim);font-size:14px;margin:6px auto 18px;max-width:380px}
.tpls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tpl{padding:9px 15px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13.5px;transition:all .25s var(--ease)}
.tpl:hover{border-color:var(--accent);background:var(--raise)}
.dayhint{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;margin-bottom:12px;border-radius:var(--r-md);background:color-mix(in srgb,var(--accent) 9%,transparent);border:1px solid var(--line);font-size:13.5px}

/* =====================================================================
   ปฏิทิน
   ===================================================================== */
.cal-head{display:flex;align-items:center;gap:10px;padding:18px 20px 0}
.cal-head h2{font-family:var(--font-num);font-weight:400;font-size:clamp(26px,5vw,34px);line-height:1;flex:1;letter-spacing:-.01em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 18px 6px}
.cal-grid .wd{text-align:center;font-size:12px;color:var(--dim);padding:4px 0}
.cd{position:relative;aspect-ratio:1;min-height:42px;border-radius:14px;display:grid;place-items:center;font-size:15px;font-weight:500;color:var(--text);transition:all .25s var(--ease);background:transparent;border:1px solid transparent}
.cd:hover:not(:disabled){background:var(--surface-2)}
.cd.part{background:color-mix(in srgb,var(--accent) 17%,transparent);border-color:color-mix(in srgb,var(--accent) 24%,transparent)}
.cd.full{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 90%,transparent)}
.cd.today{box-shadow:inset 0 0 0 1.8px var(--text)}
.cd.full.today{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--text)}
.cd.sel{outline:2px solid var(--accent);outline-offset:2px}
.cd.fut{color:var(--faint)} .cd.blank{visibility:hidden}
.cd .st{position:absolute;top:3px;right:6px;font-size:9px;color:var(--accent-2)}
.cd.full .st{color:var(--accent-ink);opacity:.85}
.cd .dw{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent-2)}
.cd.full .dw{background:var(--accent-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 22px 20px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:5px;margin-right:6px;vertical-align:-2px}
.legend .l-full{background:var(--accent)} .legend .l-part{background:color-mix(in srgb,var(--accent) 22%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.legend .l-w{border-radius:50%;width:7px;height:7px;background:var(--accent-2);vertical-align:1px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.tile{background:var(--surface);padding:14px 16px}
.tile span{display:block;font-size:12.5px;color:var(--dim)}
.tile b{font-family:var(--font-num);font-weight:400;font-size:32px;line-height:1.15}
.tile small{font-family:var(--font-ui);font-size:12px;color:var(--dim);margin-left:4px}
.drow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .em{font-size:21px;width:36px;text-align:center}
.drow .check{width:38px;height:38px}.drow .check svg{width:19px;height:19px}
.drow .t1{font-size:14.5px;font-weight:500} .drow .t2{font-size:12px;color:var(--dim)}
.wl{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.wl:last-child{border-bottom:0}
.wl b{font-weight:500}.wl span{color:var(--dim);font-size:12.5px}

/* =====================================================================
   ออกกำลังกาย
   ===================================================================== */
.subtabs{display:flex;justify-content:center;margin-bottom:18px}
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.fgrid>*{min-width:0}
.fgrid .full{grid-column:1/-1}
@media (max-width:340px){.fgrid{grid-template-columns:1fr}}
.field textarea{width:100%;padding:12px 15px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-2);outline:none;resize:vertical;min-height:70px;transition:border-color .2s,box-shadow .2s,background .2s}
.field textarea:focus,.field input[type=date]:focus{border-color:var(--accent);background:var(--raise);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.field input[type=date]{min-width:0;width:100%;font-size:14px;padding:12px 15px;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--surface-2);outline:none}
.field .stepper{display:flex;width:100%}.field .stepper input{flex:1;width:auto;min-width:0}
.feels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.feel{display:grid;justify-items:center;gap:4px;padding:11px 4px 9px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface-2);font-size:12px;color:var(--dim);transition:all .25s var(--ease);line-height:1.25;text-align:center}
.feel .e{font-size:24px}
.feel:hover{border-color:var(--accent)}
.feel[aria-pressed="true"]{background:var(--raise);border-color:var(--accent);color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.prev{margin-bottom:16px;padding:16px 18px;border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line);font-size:13.5px}
.prev .h{display:flex;justify-content:space-between;gap:10px;color:var(--dim);font-size:12.5px;margin-bottom:6px}
.prev .v{font-family:var(--font-num);font-size:26px;line-height:1.15}
.prev .nt{margin-top:6px;color:var(--dim);font-size:13px;padding-left:12px;border-left:2px solid var(--accent-2)}
.suggest{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);display:flex;gap:12px;align-items:center;justify-content:space-between}
.suggest p{font-size:13px;line-height:1.45}.suggest b{font-weight:600}
.wgroup{margin-top:20px}
.wgroup>h3{font-size:13px;font-weight:500;color:var(--dim);margin:0 4px 10px}
.wcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.wcard .nm{font-weight:500;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wcard .nums{font-family:var(--font-num);font-size:22px;line-height:1.2;margin-top:2px}
.wcard .nums small{font-family:var(--font-ui);font-size:12.5px;color:var(--dim)}
.wcard .fl{font-size:12.5px;color:var(--dim)}
.wcard .nt{grid-column:1/-1;font-size:13px;color:var(--dim);padding-left:12px;border-left:2px solid var(--line-strong);margin-top:4px}
.wcard .acts{display:flex;gap:2px;align-self:start}
.mini-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:background .2s,color .2s}
.mini-btn:hover{background:var(--surface-2);color:var(--text)}
.mini-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.exchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.exchips::-webkit-scrollbar{display:none}
.exchips .chip{flex:none;padding:7px 14px;font-size:13px}
.exchips .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.search{display:flex;gap:10px;margin-bottom:6px}
.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:6px}
.prs div{background:var(--surface);padding:12px 14px}
.prs span{font-size:12px;color:var(--dim);display:block}.prs b{font-family:var(--font-num);font-weight:400;font-size:25px}.prs small{display:block;font-size:11.5px;color:var(--faint)}
.chartbox{position:relative;margin:4px 0 6px}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.svg-grid{stroke:var(--line);stroke-width:1} .svg-lbl{fill:var(--dim);font-size:11px;font-family:var(--font-ui)}
.svg-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.svg-area{fill:url(#ga)} .svg-dot{fill:var(--raise);stroke:var(--accent);stroke-width:2}
.svg-pr{fill:var(--warn);stroke:var(--surface);stroke-width:1.5}
.tip{position:absolute;pointer-events:none;padding:7px 11px;border-radius:10px;background:var(--raise);border:1px solid var(--line-strong);box-shadow:var(--shadow);font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}

/* =====================================================================
   สถิติ
   ===================================================================== */
.hstat{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:16px 0;border-bottom:1px solid var(--line)}
.hstat:last-child{border-bottom:0}
.hstat .em{font-size:26px;grid-row:span 2;align-self:center}
.hstat .nm{font-weight:500;font-size:15px}
.hstat .nums{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
.hstat .nums b{font-family:var(--font-num);font-weight:400;font-size:20px;color:var(--text);margin-right:3px}
.hstat .bars{grid-column:1/-1}
.bars svg{width:100%;height:56px;display:block}
.bar-b{fill:var(--accent)} .bar-x{fill:var(--accent-2)} .bar-m{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1} .bar-cur{opacity:.55}
.tline{stroke:var(--text);stroke-width:1;stroke-dasharray:3 3;opacity:.45}

/* =====================================================================
   ฟอร์มใน modal / ลิ้นชัก / อื่นๆ
   ===================================================================== */
.modal .box{max-height:calc(100vh - 44px);overflow:auto}
.modal .box.wide{width:min(480px,100%)}
.modal .field{margin-bottom:14px}
.modal h3{font-family:var(--font-ui)}
.modal .acts{flex-wrap:wrap}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.emojis button{aspect-ratio:1;border-radius:11px;font-size:20px;display:grid;place-items:center;transition:background .2s}
.emojis button:hover{background:var(--surface-2)}
.emojis button[aria-pressed="true"]{background:var(--raise);box-shadow:0 0 0 2px var(--accent)}
.freq{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0}
.opt-row p{font-size:12.5px;color:var(--dim)}
.modal .acts .grow{flex:1}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
.drawer .db .btn{margin-bottom:8px}
.drawer .note{font-size:12.5px;color:var(--dim);margin-top:8px}
.field-inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){
  .app{padding-left:14px;padding-right:14px} header.top{margin:0 -14px;padding-left:14px;padding-right:14px}
  .brand span{display:none}
  .summary{padding:18px}
  .pad{padding:18px}
  .panel>.head{padding:18px 18px 0}
  .cal-grid{padding:12px 10px 4px;gap:4px}
  .tile b{font-size:27px}
}
#toasts{bottom:calc(92px + env(safe-area-inset-bottom))}
.modal .box.wide .acts{position:sticky;bottom:-26px;background:var(--surface);padding:12px 0 2px;margin-bottom:-4px}
@media (min-width:940px){.cols.two>.stack:last-child>.summary{position:sticky;top:90px}}
@media (min-width:860px){#toasts{bottom:24px}}
.seg.scroll{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}
.metrics{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
.metrics .seg button{padding:6px 11px;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ===== ฟีเจอร์เพิ่มเติม: กันซูมตอนแตะสองที + แท็บอาหาร/แคลอรี่ ===== */
html, body { touch-action: manipulation; }            /* แตะสองทีไม่ซูม (ยังบีบนิ้วซูมได้ตามปกติ) */
nav.tabs { grid-template-columns: repeat(5, 1fr); }   /* แถบเมนูมือถือ 5 ปุ่ม */
nav.tabs button { font-size: 10.5px; white-space: nowrap; padding: 8px 2px 7px; }
@media (min-width: 860px) { nav.tabs button { font-size: 14px; } }
.ring .a.over { stroke: var(--warn); }
.meal-h { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 0 2px; font-size: 13px; color: var(--dim); }
.meal-h b { font-weight: 500; color: var(--text); }
.frow { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.frow .t1 { font-size: 14.5px; font-weight: 500; overflow-wrap: anywhere; }
.frow .kc { font-family: var(--font-num); font-weight: 400; font-size: 24px; }
.frow .kc small { font-family: var(--font-ui); font-size: 12px; color: var(--dim); }
.qchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.klabels { display: flex; justify-content: space-around; font-size: 11.5px; color: var(--dim); }
.food-sum { display: flex; align-items: center; gap: 20px; }
.food-sum h3 { font-size: 16px; font-weight: 500; }
.food-sum p { color: var(--dim); font-size: 13.5px; margin-top: 2px; }
.goal-edit { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.food-sum .ring b { font-size: 22px; }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Cadence</b><span data-i18n="brand.sub"></span></div>
    <div class="grow"></div>
    <button class="icon-btn" id="btn-prefs" data-i18n-aria="prefs.title" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" data-i18n-aria="nav.label">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg><span data-i18n="tab.today"></span></button>
    <button data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span data-i18n="tab.calendar"></span></button>
    <button data-tab="workout"><svg viewBox="0 0 24 24"><path d="M6 8v8M3.5 10v4M18 8v8M20.5 10v4M6 12h12"/></svg><span data-i18n="tab.workout"></span></button>
    <button data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V5M19 20v-7"/></svg><span data-i18n="tab.stats"></span></button>
    <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4.5-3.5 8H17"/></svg><span data-i18n="tab.food"></span></button>
  </nav>

  <main>
    <section class="view" id="view-today"></section>
    <section class="view" id="view-calendar" hidden></section>
    <section class="view" id="view-workout" hidden></section>
    <section class="view" id="view-stats" hidden></section>
    <section class="view" id="view-food" hidden></section>
  </main>
</div>

<!-- ลิ้นชักตั้งค่า -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="h-prefs" aria-hidden="true">
  <div class="dh"><h2 id="h-prefs" data-i18n="prefs.title"></h2><button class="icon-btn" id="btn-prefs-close" data-i18n-aria="act.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="db">
    <section>
      <h3 data-i18n="prefs.theme"></h3><p class="sub" id="theme-name"></p>
      <div class="swatches" id="swatches">
        <button class="swatch" data-theme="marble" aria-pressed="true"><span class="sw" style="background:#f6f7f4;--sa:#2e5e4e"></span><span data-i18n="th.marble"></span></button>
        <button class="swatch" data-theme="obsidian" aria-pressed="false"><span class="sw" style="background:#15181b;--sa:#d2b27a"></span><span data-i18n="th.obsidian"></span></button>
        <button class="swatch" data-theme="sapphire" aria-pressed="false"><span class="sw" style="background:#111a2b;--sa:#7ea6ea"></span><span data-i18n="th.sapphire"></span></button>
        <button class="swatch" data-theme="bordeaux" aria-pressed="false"><span class="sw" style="background:#1c1216;--sa:#d99a8d"></span><span data-i18n="th.bordeaux"></span></button>
        <button class="swatch" data-theme="porcelain" aria-pressed="false"><span class="sw" style="background:#f6f8fb;--sa:#3a5a8c"></span><span data-i18n="th.porcelain"></span></button>
      </div>
    </section>
    <section>
      <h3 data-i18n="prefs.lang"></h3><p class="sub"></p>
      <div class="seg" role="group"><button data-lang="th" aria-pressed="true">ไทย</button><button data-lang="en" aria-pressed="false">English</button></div>
    </section>
    <section>
      <h3 data-i18n="prefs.weekstart"></h3><p class="sub" data-i18n="prefs.weekstartD"></p>
      <div class="seg" role="group" id="seg-ws"><button data-ws="1" aria-pressed="true" data-i18n="ws.mon"></button><button data-ws="0" aria-pressed="false" data-i18n="ws.sun"></button></div>
    </section>

function save() {

}
window.addEventListener('pagehide', () => { clearTimeout(saveTimer); lsSet(KEY, DB); });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- วันที่ (ใช้สตริง YYYY-MM-DD ตามเวลาท้องถิ่น) ---------- */
const pad2 = n => String(n).padStart(2, '0');

function addDays(s, n) { const d = pdate(s); d.setDate(d.getDate() + n); return dkey(d); }

/* ---------- กิจวัตร: เป้าหมายและการนับ ---------- */
const activeHabits = () => DB.habits.filter(h => !h.archived).sort((a, b) => a.order - b.order);
const habitById = id => DB.habits.find(h => h.id === id);

// สรุปผลของ "การติ๊ก" เพื่อตัดสินว่าจะฉลองหรือไม่ (เรียกหลังติ๊กเพิ่ม)

  return { count: c, target: tg, reached: c === tg, over: Math.max(0, c - tg) };
}
const habitsOnTargetInWeek = anyDay => { const hs = activeHabits().filter(h => habitActiveOn(h, weekDays(anyDay)[6])); return { on: hs.filter(h => weekCount(h, anyDay) >= targetOf(h)).length, total: hs.length }; };

/* ---------- สถานะรายวันในปฏิทิน ---------- */
function dayStatus(day) {
  const hs = DB.habits.filter(h => habitActiveOn(h, day));
  const done = hs.filter(h => isDone(day, h.id)); if (!done.length) return { level: 'none', done: 0, total: hs.length };
  const daily = hs.filter(h => h.type === 'daily');
  const full = daily.length ? daily.every(h => isDone(day, h.id)) : true;
  return { level: full ? 'full' : 'part', done: done.length, total: hs.length };
}
function weekGoalHitOn(day) { return DB.habits.some(h => habitActiveOn(h, day) && isDone(day, h.id) && countUpTo(h, day) === targetOf(h)); }

/* ---------- สตรีค / สถิติต่อกิจวัตร ---------- */
function habitStats(h) {
  const today = todayKey(), curWeek = weekStartOf(today), tg = targetOf(h); let total = 0, over = 0, goals = 0;
  Object.keys(DB.logs).forEach(k => { if (DB.logs[k].includes(h.id)) total++; });
  const weeks = []; const first = weekStartOf(h.createdAt);
  for (let w = first; w <= curWeek; w = addDays(w, 7)) { const c = weekCount(h, w); weeks.push({ w, c }); if (c >= tg) goals++; over += Math.max(0, c - tg); }
  let cur = 0, best = 0, unit = 'day';

    let run = 0; for (let d = h.createdAt; d <= today; d = addDays(d, 1)) { if (isDone(d, h.id)) { run++; best = Math.max(best, run); } else run = 0; }
    let d = today; if (!isDone(d, h.id)) d = addDays(d, -1);

  } else {

    for (let i = weeks.length - 1; i >= 0; i--) { if (weeks[i].c >= tg) cur++; else if (i === weeks.length - 1) continue; else break; }
  }
  const last12 = []; for (let i = 11; i >= 0; i--) { const w = addDays(curWeek, -7 * i); last12.push({ w, c: w >= first ? weekCount(h, w) : null }); }

/* ---------- ออกกำลังกาย ---------- */
const normEx = s => s.trim().toLowerCase();

const e1rm = w => w.weight ? w.weight * (1 + w.reps / 30) : null;
function exerciseNames() { const m = new Map(); DB.workouts.forEach(w => { const k = normEx(w.ex); const e = m.get(k) || { name: w.ex, n: 0, last: '' }; e.n++; if (w.date >= e.last) { e.last = w.date; e.name = w.ex; } m.set(k, e); }); return [...m.values()].sort((a, b) => b.last.localeCompare(a.last)); }

  const k = normEx(ex); let best = null;
  DB.workouts.forEach(w => { if (w.id === ignoreId || normEx(w.ex) !== k) return; if (beforeDate && w.date > beforeDate) return; if (!best || w.date > best.date || (w.date === best.date && w.ts > best.ts)) best = w; });
  return best;
}
function agoText(day) {
  const n = daysBetween(day, todayKey()); if (n <= 0) return t('ago.today'); if (n === 1) return t('ago.yesterday'); if (n < 14) return t('ago.days', { n });
  if (n < 60) return t('ago.weeks', { n: Math.round(n / 7) }); return t('ago.months', { n: Math.round(n / 30) });
}
const loadText = w => w ? nfmt(w, 2) + ' ' + t('u.kg') : t('u.bw');
// ข้อเสนอ progressive overload จากฟีลลิ่งครั้งก่อน (กฎง่ายๆ ไม่ใช่คำแนะนำทางการแพทย์)
function suggestNext(last) {
  const step = last.weight && last.weight >= 20 ? 2.5 : 1; let w = last.weight, r = last.reps, key = last.feeling === 'weak' ? 'sg.weak' : 'sg.target', vars = {};

  else if (last.feeling === 'energetic') { if (w && r >= 12) { key = 'sg.energeticUp'; vars.r0 = r; w += step; r = 8; } else { key = 'sg.energetic'; r += 1; } }

}
// สถิติสูงสุดสะสมตามลำดับเวลา เพื่อติดป้าย "สถิติใหม่"

  const flags = new Set(), best = {};
  [...DB.workouts].sort((a, b) => a.date.localeCompare(b.date) || a.ts - b.ts).forEach(w => {
    const k = normEx(w.ex), score = w.weight ? e1rm(w) : w.reps * w.sets, b = best[k];
    if (b === undefined) best[k] = score; else if (score > b + 1e-9) { best[k] = score; flags.add(w.id); }
  });
  return flags;
}

  DB.workouts.forEach(w => { if (normEx(w.ex) !== k) return; (by[w.date] = by[w.date] || []).push(w); });
  return Object.keys(by).sort().map(d => { const ws = by[d]; const wt = ws.filter(x => x.weight);
    return { date: d, weight: wt.length ? Math.max(...wt.map(x => x.weight)) : null, volume: ws.reduce((a, x) => a + vol(x), 0),
      e1rm: wt.length ? Math.max(...wt.map(e1rm)) : null, reps: Math.max(...ws.map(x => x.reps)) }; });
}

/* ---------- ตัวอย่างข้อมูล + นำเข้า/ส่งออก ---------- */
function loadSample() {
  const today = todayKey(), start = addDays(weekStartOf(today), -49); let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const mk = (name, emoji, type, target, slot, link) => ({ id: uid(), name, emoji, type, target, slot, linkWorkout: link, archived: false, archivedAt: null, createdAt: start, order: DB.habits.length + 0 });
  const hs = [mk(t('tpl.water'), '💧', 'daily', 7, 'any', false), mk(t('tpl.train'), '🏋️', 'weekly', 3, 'afternoon', true), mk(t('tpl.read'), '📖', 'weekly', 5, 'evening', false), mk(t('tpl.med'), '🧘', 'daily', 7, 'morning', false)];
  hs.forEach((h, i) => { h.order = DB.habits.length + i; DB.habits.push(h); });
  const p = [0.8, 0.5, 0.65, 0.7];
  for (let d = start; d <= today; d = addDays(d, 1)) hs.forEach((h, i) => { if (rnd() < p[i] + (d > addDays(today, -21) ? .1 : 0)) (DB.logs[d] = DB.logs[d] || []).includes(h.id) || (DB.logs[d] = DB.logs[d] || []).push(h.id); });
  const ex = [['Bench Press', 40, 8], ['Squat', 50, 8], ['Overhead Press', 25, 8]]; const fl = ['weak', 'target', 'target', 'energetic', 'spare'];
  for (let wk = 0; wk < 7; wk++) ex.forEach((e, i) => { const date = addDays(start, wk * 7 + i * 2 + 1); if (date > today) return;
    const w = e[1] + Math.floor(wk / 2) * 2.5, f = fl[Math.min(4, Math.floor(rnd() * 5))];
    DB.workouts.push({ id: uid(), date, ex: e[0], weight: w, reps: e[2] + (wk % 2), sets: 3, feeling: f, note: wk % 3 === 0 ? (LANG === 'th' ? 'ฟอร์มดี ครั้งหน้าลองเพิ่มน้ำหนัก' : 'Form felt good, try more weight next time') : '', ts: pdate(date).getTime() }); });
  save();
}
function exportJSON() {
  const blob = new Blob([JSON.stringify({ app: 'cadence', version: 1, exportedAt: new Date().toISOString(), data: DB }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cadence-backup-' + todayKey() + '.json'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  PREFS.lastExport = todayKey(); savePrefs();
}
function parseImport(text) {
  let j; try { j = JSON.parse(text); } catch (e) { return null; }
  const d = j && j.app === 'cadence' && j.data ? j.data : (j && Array.isArray(j.habits) ? j : null); if (!d) return null;
  const n = normalize(d); return n.habits.length || n.workouts.length || n.meals.length || Object.keys(n.logs).length ? n : null;
}
function mergeDB(n) {
  const ids = new Set(DB.habits.map(h => h.id)); n.habits.forEach(h => { if (!ids.has(h.id)) { h.order = DB.habits.length; DB.habits.push(h); } });
  Object.keys(n.logs).forEach(k => { const cur = DB.logs[k] || (DB.logs[k] = []); n.logs[k].forEach(id => { if (!cur.includes(id)) cur.push(id); }); });
  const wid = new Set(DB.workouts.map(w => w.id)); n.workouts.forEach(w => { if (!wid.has(w.id)) DB.workouts.push(w); });
  const mid = new Set(DB.meals.map(m => m.id)); n.meals.forEach(m => { if (!mid.has(m.id)) DB.meals.push(m); });
  DB = normalize(DB);

/* =====================================================================

   ===================================================================== */

function cfResize() { const cv = CF.cv, d = Math.min(window.devicePixelRatio || 1, 2); CF.w = innerWidth; CF.h = innerHeight; cv.width = CF.w * d; cv.height = CF.h * d; CF.ctx.setTransform(d, 0, 0, d, 0, 0); }

function barsSVG(vals, target, w = 300, h = 56) {

    if (v === null) { out += `<rect class="bar-m" x="${x}" y="${h - 4}" width="${ww}" height="3" rx="1.5"/>`; return; }
    const hh = Math.max(3, v / mx * (h - 6)), y = h - hh, base = Math.min(v, target) / mx * (h - 6);
    out += `<rect class="bar-b${last ? ' bar-cur' : ''}" x="${x}" y="${h - Math.max(3, base)}" width="${ww}" height="${Math.max(3, base)}" rx="3"/>`;
    if (v > target) out += `<rect class="bar-x${last ? ' bar-cur' : ''}" x="${x}" y="${y}" width="${ww}" height="${hh - base}" rx="3"/>`; });
  const ty = h - target / mx * (h - 6); return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${out}<line class="tline" x1="0" x2="${w}" y1="${ty}" y2="${ty}"/></svg>`;

    $('#modal-box').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; $('#modal-box').onclick = null; closeModal(); if (b.dataset.m === 'no') return;
      if (b.dataset.m === 'replace') DB = n; else mergeDB(n); save(); toast(t('tt.imported'), 'ok'); renderAll(); }; };
  r.readAsText(file);
}

/* ---------- ลิ้นชักตั้งค่า / ติดตั้งแอป ---------- */
let deferredInstall = null;
function installInfo() {
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone, ios = /iphone|ipad|ipod/i.test(navigator.userAgent), btn = $('#btn-install');
  btn.hidden = !deferredInstall || standalone; $('#install-info').textContent = standalone ? t('install.done') : deferredInstall ? t('install.can') : ios ? t('install.ios') : t('install.other');
}
function openDrawer() { backupInfo(); installInfo(); $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false'); $('#scrim').classList.add('on'); $('#btn-prefs-close').focus(); }
function closeDrawer() { $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true'); $('#scrim').classList.remove('on'); }
function setLang(l) { LANG = l; PREFS.lang = l; savePrefs(); applyI18n(); $('#theme-name').textContent = t('th.' + document.documentElement.dataset.theme); backupInfo(); installInfo(); renderAll(); }
function syncWeekStart() { $$('#seg-ws button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.ws === PREFS.weekStart))); }

/* ---------- คลิกทั้งหมด (event delegation) ---------- */
document.addEventListener('click', async e => {
  const tb = e.target.closest('#tabs [data-tab]'); if (tb) return setTab(tb.dataset.tab);
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'tick': return onTick(UI.sel, d.id, el);
    case 'caltick': return onTick(UI.calSel, d.id, el);
    case 'edit': return openHabitEditor(d.id);
    case 'selday': UI.sel = d.day; return renderToday();
    case 'addhabit': return openHabitEditor(null);
    case 'tpl': return addFromTemplate(+d.k);
    case 'he-emoji': HE.emoji = d.e; $('#he-own').value = ''; return heSync();
    case 'he-type': HE.type = d.v; return heSync();
    case 'he-tgt': HE.target = Math.max(1, Math.min(7, HE.target + +d.d)); return heSync();
    case 'he-slot': HE.slot = d.v; return heSync();
    case 'he-save': return heSave();
    case 'he-cancel': return closeModal();
    case 'he-archive': return archiveHabit(HE.id);
    case 'he-delete': { const id = HE.id; closeModal(); return deleteHabit(id); }
    case 'calprev': UI.calM--; if (UI.calM < 0) { UI.calM = 11; UI.calY--; } return renderCalendar();
    case 'calnext': UI.calM++; if (UI.calM > 11) { UI.calM = 0; UI.calY++; } return renderCalendar();
    case 'caltoday': { const n = new Date(); UI.calY = n.getFullYear(); UI.calM = n.getMonth(); UI.calSel = todayKey(); return renderCalendar(); }
    case 'calday': UI.calSel = d.day; { const x = pdate(d.day); UI.calY = x.getFullYear(); UI.calM = x.getMonth(); } return renderCalendar();
    case 'caladdw': if (!UI.form || !UI.form.id) UI.form = newForm(d.day); UI.wkTab = 'log'; return setTab('workout');
    case 'wsub': UI.wkTab = d.v; return renderWorkout();
    case 'feel': UI.form.feeling = d.v; $$('.feel').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); return;
    case 'wstep': { const f = UI.form, k = d.f, dir = +d.d; let v = parseFloat(f[k]);
      if (k === 'weight') { if (isNaN(v)) { const l = f.ex.trim() ? lastSession(f.ex, f.date, f.id) : null; v = l && l.weight ? l.weight : 0; if (dir > 0 && !v) v = 0; } v = Math.max(0, +(v + dir * 2.5).toFixed(2)); f.weight = v ? String(v) : ''; }
      else { v = Math.max(1, (isNaN(v) ? 1 : v) + dir); f[k] = v; }
      const inp = $(`input[data-f="${k}"]`); if (inp) inp.value = f[k]; return; }
    case 'usesg': fillForm({ weight: d.w === '' ? '' : String(+d.w), reps: +d.r, sets: +d.s }); return toast(t('tt.saved'));
    case 'wsave': return saveWorkout();
    case 'wcancel': UI.form = newForm(UI.form.date); return renderWorkoutBody();
    case 'wedit': { const w = DB.workouts.find(x => x.id === d.id); if (!w) return; UI.form = { id: w.id, ex: w.ex, weight: w.weight ? String(w.weight) : '', reps: w.reps, sets: w.sets, feeling: w.feeling, note: w.note, date: w.date }; UI.wkTab = 'log'; renderWorkout(); return window.scrollTo(0, 0); }
    case 'wdel': { if (!(await confirmBox(t('wh.delT'), t('wh.delP'), t('act.delete'), true))) return; DB.workouts = DB.workouts.filter(x => x.id !== d.id); if (UI.form && UI.form.id === d.id) UI.form = newForm(); save(); renderWorkoutBody(); return toast(t('tt.workoutDeleted')); }
    case 'exsel': UI.wkEx = d.ex; return renderWorkoutBody();
    case 'wmetric': UI.wkMetric = d.v; return renderWorkoutBody();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#modal').hidden) closeModal(); else if ($('#drawer').classList.contains('on')) closeDrawer(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.main[data-act="edit"]')) { e.preventDefault(); openHabitEditor(e.target.dataset.id); }
  if (e.key === 'Enter' && e.target.id === 'he-name') { e.preventDefault(); heSave(); }
});
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.f; if (!f) return; const v = e.target.value;
  if (f === 'search') { UI.wkSearch = v; const h = $('#wk-hist'); if (h) h.innerHTML = historyListHTML(); return; }
  if (!UI.form) return; if (f === 'date') return; UI.form[f] = v; if (f === 'ex') refreshPrev();
});
document.addEventListener('change', e => { if (e.target.dataset && e.target.dataset.f === 'date' && UI.form) { UI.form.date = e.target.value || todayKey(); renderWorkoutBody(); } });

/* ---------- เริ่มทำงาน ---------- */
function init() {
  CF.cv = $('#confetti'); CF.ctx = CF.cv.getContext('2d'); cfResize(); addEventListener('resize', cfResize);
  const dark = matchMedia('(prefers-color-scheme: dark)').matches; applyI18n(); setTheme(PREFS.theme || (dark ? 'obsidian' : 'marble'), false); syncWeekStart();
  UI.form = newForm();
  $('#btn-prefs').addEventListener('click', openDrawer); $('#btn-prefs-close').addEventListener('click', closeDrawer); $('#scrim').addEventListener('click', closeDrawer);
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !$('#modal-box').onclick) closeModal(); });
  $$('#swatches .swatch').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
  $$('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  $$('#seg-ws button').forEach(b => b.addEventListener('click', () => { PREFS.weekStart = +b.dataset.ws; savePrefs(); syncWeekStart(); renderAll(); }));
  $('#btn-export').addEventListener('click', () => { exportJSON(); backupInfo(); toast(t('tt.exported'), 'ok'); });
  $('#btn-import').addEventListener('click', () => $('#file-import').click());
  $('#file-import').addEventListener('change', e => { onImportFile(e.target.files[0]); e.target.value = ''; });
  $('#btn-sample').addEventListener('click', async () => { if (await confirmBox(t('sample.title'), t('sample.text'), t('sample.ok'))) { loadSample(); closeDrawer(); renderAll(); toast(t('tt.sample'), 'ok'); } });
  $('#btn-wipe').addEventListener('click', async () => { if (await confirmBox(t('wipe.title'), t('wipe.text'), t('wipe.ok'), true)) { DB = emptyDB(); save(); UI.form = newForm(); closeDrawer(); renderAll(); toast(t('tt.wiped')); } });
  $('#btn-install').addEventListener('click', async () => { if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; installInfo(); });
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; installInfo(); });
  addEventListener('appinstalled', () => { deferredInstall = null; installInfo(); toast(t('tt.installed'), 'ok'); });
  let lastDay = todayKey(); document.addEventListener('visibilitychange', () => { if (document.hidden) return; const n = todayKey(); if (n !== lastDay) { if (UI.sel === lastDay) UI.sel = n; if (UI.calSel === lastDay) UI.calSel = n; lastDay = n; } renderAll(); });
  const q = new URLSearchParams(location.search).get('tab'); setTab(Object.keys(VIEWS).includes(q) ? q : 'today');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(reg => reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast(t('tt.update')); }); })).catch(() => {});
  }
}

Object.assign(I18N.th, {

});
Object.assign(I18N.en, {
  'tab.food':'Food','food.sum':'Calories today','food.line':'{a} of {g} kcal eaten','food.left':'{n} kcal left','food.over':'{n} kcal over','food.setGoal':'Set calorie goal',
  'food.goalPh':'Daily goal (kcal)','food.add':'Add food','food.edit':'Edit entry','food.name':'Food','food.namePh':'e.g. Chicken rice','food.kcal':'Calories (kcal)','food.meal':'Meal',
  'meal.breakfast':'Breakfast','meal.lunch':'Lunch','meal.dinner':'Dinner','meal.snack':'Snack','food.save':'Save food','food.update':'Update entry','food.cancel':'Cancel editing',
  'food.quick':'Often eaten (tap to add again)','food.empty':'No food logged for this day','food.week':'Week overview','food.avg':'Average {n} kcal a day','food.req':'Enter a food name and a valid calorie number',
  'food.goalBad':'The calorie goal must be between 500 and 10,000','food.added':'Food logged','food.delT':'Delete this food entry?','food.delP':'This entry will be deleted for good.','food.hint':'Calories are numbers you enter yourself. The app does not look them up from the food name.'
});
const MEALS = ['breakfast', 'lunch', 'dinner', 'snack'];
UI.foodDay = todayKey(); UI.foodForm = null; UI.foodGoalEdit = false;
const mealNow = () => { const h = new Date().getHours(); return h < 10 ? 'breakfast' : h < 15 ? 'lunch' : h < 21 ? 'dinner' : 'snack'; };
const dayKcal = d => DB.meals.filter(m => m.date === d).reduce((a, m) => a + m.kcal, 0);
function frequentFoods() {
  const map = new Map();
  [...DB.meals].sort((a, b) => a.ts - b.ts).forEach(x => { const k = x.name.toLowerCase(), e = map.get(k) || { n: 0 }; map.set(k, { name: x.name, kcal: x.kcal, meal: x.meal, n: e.n + 1 }); });
  return [...map.values()].sort((a, b) => b.n - a.n);
}
function renderFood() {
  const root = $('#view-food'), today = todayKey(), sel = UI.foodDay > today ? today : UI.foodDay, goal = DB.goalKcal || 2000;
  const f = UI.foodForm || (UI.foodForm = { id: null, meal: mealNow(), name: '', kcal: '' });
  const total = dayKcal(sel), diff = goal - total, C = 2 * Math.PI * 40, wd = weekDays(sel), freq = frequentFoods();
  const strip = wd.map(d => `<button class="dchip${d === today ? ' today' : ''}" data-fa="fday" data-day="${d}" aria-pressed="${d === sel}" ${d > today ? 'disabled' : ''}><small>${esc(fmtDate(d, { weekday: 'short' }))}</small><span class="n">${pdate(d).getDate()}</span><span class="pbar" style="--p:${Math.min(1, dayKcal(d) / goal).toFixed(2)}"></span></button>`).join('');
  const entries = DB.meals.filter(m => m.date === sel);
  const list = entries.length ? MEALS.map(k => [k, entries.filter(m => m.meal === k).sort((a, b) => a.ts - b.ts)]).filter(g => g[1].length).map(([k, arr]) =>
    `<div class="meal-h"><span>${esc(t('meal.' + k))}</span><b>${nfmt(arr.reduce((a, m) => a + m.kcal, 0))} kcal</b></div>` + arr.map(m =>
      `<div class="frow"><div class="t1">${esc(m.name)}</div><b class="kc">${nfmt(m.kcal)}<small> kcal</small></b><div style="display:flex"><button class="mini-btn" data-fa="fedit" data-id="${m.id}" aria-label="${esc(t('act.edit'))}"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/></svg></button><button class="mini-btn" data-fa="fdel" data-id="${m.id}" aria-label="${esc(t('act.delete'))}"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></div></div>`).join('')).join('')
    : `<p class="dimtxt tiny" style="padding:14px 0;text-align:center">${esc(t('food.empty'))}</p>`;
  const vals = wd.map(d => (d > today || !DB.meals.some(m => m.date === d)) ? null : dayKcal(d)), logged = vals.filter(v => v !== null), avg = logged.length ? Math.round(logged.reduce((a, b) => a + b, 0) / logged.length) : 0;
  const summary = `<div class="panel pad food-sum"><div class="ring"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="40"/><circle class="a${diff < 0 ? ' over' : ''}" cx="50" cy="50" r="40" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - Math.min(1, total / goal))).toFixed(1)}"/></svg><b class="num">${Math.round(total / goal * 100)}%</b></div>
    <div style="flex:1;min-width:0"><h3>${esc(t('food.sum'))}</h3><p>${esc(t('food.line', { a: nfmt(total), g: nfmt(goal) }))}</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px"><span class="badge ${diff < 0 ? 'plus' : 'ok'}">${esc(diff < 0 ? t('food.over', { n: nfmt(-diff) }) : t('food.left', { n: nfmt(diff) }))}</span><button class="link" data-fa="fgoal">${esc(t('food.setGoal'))}</button></div>
    ${UI.foodGoalEdit ? `<div class="goal-edit"><div class="stepper" style="flex:1"><input type="number" inputmode="numeric" data-ff="goal" value="${goal}" placeholder="${esc(t('food.goalPh'))}" style="width:100%"></div><button class="btn" data-fa="fgoalsave">${esc(t('act.save'))}</button></div>` : ''}</div></div>`;
  const form = `<div class="panel pad"><h2 style="font-size:17px;font-weight:500;margin-bottom:12px">${esc(t(f.id ? 'food.edit' : 'food.add'))}</h2>
    <div class="seg" role="group" style="margin-bottom:14px;max-width:100%;overflow-x:auto">${MEALS.map(k => `<button data-fa="meal" data-v="${k}" aria-pressed="${f.meal === k}">${esc(t('meal.' + k))}</button>`).join('')}</div>
    <div class="fgrid"><div class="field full"><span>${esc(t('food.name'))}</span><input type="text" data-ff="name" list="foodlist" value="${esc(f.name)}" placeholder="${esc(t('food.namePh'))}" maxlength="80" autocomplete="off"><datalist id="foodlist">${freq.map(x => `<option value="${esc(x.name)}"></option>`).join('')}</datalist></div>
    <div class="field full"><span>${esc(t('food.kcal'))}</span><input type="number" inputmode="numeric" min="0" max="20000" data-ff="kcal" value="${esc(f.kcal)}" placeholder="0" style="width:100%;padding:12px 15px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2)"></div></div>
    <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" style="flex:1" data-fa="fsave">${esc(t(f.id ? 'food.update' : 'food.save'))}</button>${f.id ? `<button class="btn ghost" data-fa="fcancel">${esc(t('food.cancel'))}</button>` : ''}</div>
    <p class="dimtxt tiny" style="margin-top:12px">${esc(t('food.hint'))}</p>
    ${freq.length ? `<h3 style="font-size:13px;font-weight:500;color:var(--dim);margin:18px 0 8px">${esc(t('food.quick'))}</h3><div class="qchips">${freq.slice(0, 8).map(x => `<button class="chip" data-fa="fquick" data-name="${esc(x.name)}" data-kcal="${x.kcal}" data-meal="${x.meal}">${esc(x.name)} · ${nfmt(x.kcal)}</button>`).join('')}</div>` : ''}</div>`;
  root.innerHTML = `<div class="weekstrip" style="margin-top:0">${strip}</div><div class="cols two"><div class="stack">${summary}${form}<div class="panel pad"><h2 style="font-size:15px;font-weight:500">${esc(fmtDate(sel, { weekday: 'long', day: 'numeric', month: 'long' }))}</h2>${list}</div></div>
    <div class="stack"><div class="panel pad"><h2 style="font-size:16px;font-weight:500">${esc(t('food.week'))}</h2><p class="sub" style="margin-bottom:8px">${esc(logged.length ? t('food.avg', { n: nfmt(avg) }) : '')}</p>${barsSVG(vals, goal, 300, 90)}<div class="klabels">${wd.map(d => `<span>${esc(fmtDate(d, { weekday: 'short' }))}</span>`).join('')}</div></div></div></div>`;
}
(function wireFood() {
  const root = $('#view-food'); if (!root) return;
  const saveFood = () => {
    const f = UI.foodForm, name = (f.name || '').trim(), kcal = Math.round(Number(f.kcal));
    if (!name || f.kcal === '' || !(kcal >= 0 && kcal <= 20000)) return toast(t('food.req'), 'bad');
    const old = f.id ? DB.meals.find(m => m.id === f.id) : null, entry = { id: f.id || uid(), date: old ? old.date : UI.foodDay, meal: f.meal, name: name.slice(0, 80), kcal, ts: old ? old.ts : Date.now() };
    if (old) DB.meals[DB.meals.indexOf(old)] = entry; else DB.meals.push(entry);
    save(); UI.foodForm = { id: null, meal: f.meal, name: '', kcal: '' }; renderFood(); toast(t('food.added'), 'ok');
  };
  root.addEventListener('click', async e => {
    const el = e.target.closest('[data-fa]'); if (!el) return; const a = el.dataset.fa, d = el.dataset;
    if (a === 'fday') { UI.foodDay = d.day; return renderFood(); }
    if (a === 'meal') { UI.foodForm.meal = d.v; return $$('[data-fa=meal]', root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); }
    if (a === 'fsave') return saveFood();
    if (a === 'fcancel') { UI.foodForm = { id: null, meal: mealNow(), name: '', kcal: '' }; return renderFood(); }
    if (a === 'fedit') { const m = DB.meals.find(x => x.id === d.id); if (!m) return; UI.foodForm = { id: m.id, meal: m.meal, name: m.name, kcal: String(m.kcal) }; renderFood(); return window.scrollTo(0, 0); }
    if (a === 'fdel') { if (!(await confirmBox(t('food.delT'), t('food.delP'), t('act.delete'), true))) return; DB.meals = DB.meals.filter(x => x.id !== d.id); if (UI.foodForm && UI.foodForm.id === d.id) UI.foodForm = null; save(); return renderFood(); }
    if (a === 'fquick') { DB.meals.push({ id: uid(), date: UI.foodDay, meal: d.meal, name: d.name, kcal: +d.kcal, ts: Date.now() }); save(); renderFood(); return toast(t('food.added'), 'ok'); }
    if (a === 'fgoal') { UI.foodGoalEdit = !UI.foodGoalEdit; return renderFood(); }
    if (a === 'fgoalsave') { const g = Math.round(Number($('[data-ff=goal]', root).value)); if (!(g >= 500 && g <= 10000)) return toast(t('food.goalBad'), 'bad'); DB.goalKcal = g; UI.foodGoalEdit = false; save(); return renderFood(); }
  });
  root.addEventListener('input', e => {
    const k = e.target.dataset.ff; if (!k || k === 'goal') return; UI.foodForm[k] = e.target.value;
    if (k === 'name' && UI.foodForm.kcal === '') { const hit = frequentFoods().find(x => x.name.toLowerCase() === e.target.value.trim().toLowerCase()); if (hit) { UI.foodForm.kcal = String(hit.kcal); $('[data-ff=kcal]', root).value = hit.kcal; } }
  });
  root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.ff && e.target.dataset.ff !== 'goal') { e.preventDefault(); saveFood(); } });
})();
init();
